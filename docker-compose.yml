version: '3.8'\n\nservices:\n  postgres:\n    image: postgres:15-alpine\n    container_name: chatbot_postgres\n    environment:\n      POSTGRES_USER: postgres\n      POSTGRES_PASSWORD: password\n      POSTGRES_DB: chatbot_platform\n    ports:\n      - "5432:5432"\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n    networks:\n      - chatbot_network\n\n  redis:\n    image: redis:7-alpine\n    container_name: chatbot_redis\n    ports:\n      - "6379:6379"\n    networks:\n      - chatbot_network\n\n  admin-api:\n    build:\n      context: ./backend/admin-api\n      dockerfile: Dockerfile\n    container_name: chatbot_admin_api\n    ports:\n      - "4000:4000"\n    environment:\n      DATABASE_URL: postgresql://postgres:password@postgres:5432/chatbot_platform\n      REDIS_HOST: redis\n      REDIS_PORT: 6379\n      JWT_SECRET: your-jwt-secret-change-in-production\n      GEMINI_API_KEY: ${GEMINI_API_KEY}\n      NODE_ENV: development\n    depends_on:\n      - postgres\n      - redis\n    networks:\n      - chatbot_network\n    volumes:\n      - ./backend/admin-api:/app\n      - /app/node_modules\n\n  conversation-engine:\n    build:\n      context: ./backend/conversation-engine\n      dockerfile: Dockerfile\n    container_name: chatbot_conversation_engine\n    ports:\n      - "8000:8000"\n    environment:\n      DATABASE_URL: postgresql://postgres:password@postgres:5432/chatbot_platform\n      REDIS_HOST: redis\n      REDIS_PORT: 6379\n      GEMINI_API_KEY: ${GEMINI_API_KEY}\n    depends_on:\n      - postgres\n      - redis\n    networks:\n      - chatbot_network\n    volumes:\n      - ./backend/conversation-engine:/app\n\n  webhook-handler:\n    build:\n      context: ./backend/webhook-handler\n      dockerfile: Dockerfile\n    container_name: chatbot_webhook_handler\n    ports:\n      - "5000:5000"\n    environment:\n      REDIS_HOST: redis\n      REDIS_PORT: 6379\n      CONVERSATION_ENGINE_URL: http://conversation-engine:8000\n      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}\n      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN}\n      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}\n    depends_on:\n      - redis\n      - conversation-engine\n    networks:\n      - chatbot_network\n    volumes:\n      - ./backend/webhook-handler:/app\n      - /app/node_modules\n\n  frontend:\n    build:\n      context: ./frontend\n      dockerfile: Dockerfile\n    container_name: chatbot_frontend\n    ports:\n      - "3000:3000"\n    environment:\n      NEXT_PUBLIC_API_URL: http://localhost:4000\n    depends_on:\n      - admin-api\n    networks:\n      - chatbot_network\n    volumes:\n      - ./frontend:/app\n      - /app/node_modules\n      - /app/.next\n\nnetworks:\n  chatbot_network:\n    driver: bridge\n\nvolumes:\n  postgres_data: